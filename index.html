<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>branch workspace</title>
        <style>

            body {
                background-color: transparent;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
            }
            .sky-frame{
                position:absolute;
                bottom: 60px;
                left:30px;
                width:200px;
                height: 180px;
                background-color:#639cd9;
                border-radius: 20px;
                box-shadow: 0 8px 25px rgba(99, 156, 217, 0.25), inset 0 -88px 20px rgba(0,0,0,0.1);
                backdrop-filter: blur(4px);
                -webkit-app-region: drag;
            }
            .swaying-branch{
                position:absolute;
                bottom:100px;
                left:8px;
                width:200px;
                height:180px;
                transform-origin: bottom left;
                animation: sway 7s ease-in-out infinite alternate;
                
            }
            .branch-image{
                width: 300%;
                height: auto;
                display: block;

            }
            
            
            @keyframes sway{
                0% { transform:rotate(-4deg)  translateY(-8px);}
                100% { transform: rotate(4deg) translateY(8px);}
            }
            
        </style>
    </head>
<body>
    <div class="sky-frame"></div>
    <div class="swaying-branch">
        <img src="branch-art.png" alt="branch" class="branch-image">
    </div>
</body>
</html>
